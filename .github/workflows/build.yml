name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accetta licenze Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug
        run: gradle assembleDebug --no-daemon
        working-directory: MioPlayer
      - name: Build release (piu veloce)
        run: gradle assembleRelease --no-daemon
        working-directory: MioPlayer
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: GGPLAY-debug
          path: MioPlayer/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GGPLAY-release
          path: MioPlayer/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
