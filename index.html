<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device, initial-scale=1.0">
    <title>MioPlayer Pro</title>
    
    <!-- Configurazione per iPhone (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Libreria per generare i QR Code (Sostituisce ZXing di Android) -->
    <script src="https://cloudflare.com"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; padding: 20px; min-height: 100vh; gap: 20px; }
        
        /* Layout sdoppiato: perfetto per lo schermo grande della TV */
        .main-content { flex: 2; display: flex; flex-direction: column; gap: 15px; }
        .side-panel { flex: 1; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; }

        .controls { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 15px; }
        .btn-row { display: flex; gap: 10px; }
        
        button { background: #e50914; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover, button:focus { background: #f40b16; outline: 3px solid white; transform: scale(1.02); }

        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2b2b2b; color: white; }
        
        /* Area QR Code e Connessione */
        .qr-container { background: white; padding: 10px; border-radius: 8px; display: inline-block; }
        .info-text { text-align: center; font-size: 0.9rem; color: #aaa; }
        .ip-address { font-size: 1.1rem; color: #00ffcc; font-weight: bold; margin: 5px 0; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Parte Sinistra: Video e Controlli principali -->
    <div class="main-content">
        <div class="video-box">
            <video id="player" controls autoplay>
                <source src="https://googleapis.com" type="video/mp4">
            </video>
        </div>

        <div class="controls">
            <h2 id="video-title">MioPlayer - Streaming Attivo</h2>
            <div class="btn-row">
                <input type="text" id="stream-url" placeholder="Incolla qui un link streaming, video o lista...">
                <button onclick="changeSource()">Carica Canale</button>
            </div>
        </div>
    </div>

    <!-- Parte Destra: Pannello Connessione Remota (Sostituisce NanoHTTPD e ZXing) -->
    <div class="side-panel">
        <h3>Connessione Remota</h3>
        <p class="info-text">Scansiona il codice o collegati via browser per controllare la TV dal telefono:</p>
        
        <!-- Indirizzo IP simulato basato sul tuo link attuale -->
        <div class="ip-address" id="web-ip">In caricamento...</div>
        
        <!-- Il quadratino dove apparirà il QR Code -->
        <div class="qr-container">
            <div id="qrcode"></div>
        </div>
        
        <p class="info-text" style="font-size: 0.8rem;">Usa questo pannello per accoppiare l'app dell'iPhone con lo schermo della TV.</p>
    </div>

    <script>
        const player = document.getElementById('player');
        const streamUrl = document.getElementById('stream-url');
        const videoTitle = document.getElementById('video-title');

        // Genera automaticamente il QR Code in base all'indirizzo internet attuale
        const currentUrl = window.location.href;
        document.getElementById('web-ip').innerText = currentUrl.replace('https://', '').replace('/', '');
        
        new QRCode(document.getElementById("qrcode"), {
            text: currentUrl,
            width: 150,
            height: 150,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Funzione per cambiare canale / video streaming
        function changeSource() {
            const url = streamUrl.value.trim();
            if(url) {
                player.src = url;
                videoTitle.innerText = "Canale Personalizzato";
                player.play();
            }
        }

        // Supporto telecomando TV (Tasto OK/Invio per Play/Pausa)
        document.addEventListener('keydown', function(e) {
            if (e.key === "Enter" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "BUTTON") {
                if (player.paused) { player.play(); } else { player.pause(); }
            }
        });
    </script>
</body>
</html>
